<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#6C47FF"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="DeliveryOS Admin"/>
<title>DeliveryOS Admin</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#6C47FF;--brand2:#A78BFA;--accent:#FF6B6B;
  --dark:#09090F;--surface:#11111A;--card:#18182A;--border:#252540;
  --text:#F0F0FF;--muted:#6B6B99;
  --success:#10B981;--warning:#F59E0B;--danger:#EF4444;
  --safe-top:env(safe-area-inset-top);--safe-bot:env(safe-area-inset-bottom);
}
html{background:var(--dark);height:100%}
body{font-family:'Manrope',sans-serif;color:var(--text);background:var(--dark);
  min-height:100%;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea,select{font-family:inherit;outline:none}

#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--dark);display:flex;flex-direction:column}

/* Login Screen */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:32px 24px;background:var(--dark);position:relative;overflow:hidden}
.login-screen::before{content:'';position:absolute;top:-100px;left:-100px;width:400px;height:400px;
  background:radial-gradient(circle,rgba(108,71,255,.2),transparent 60%);pointer-events:none}
.login-screen::after{content:'';position:absolute;bottom:-80px;right:-80px;width:300px;height:300px;
  background:radial-gradient(circle,rgba(255,107,107,.1),transparent 60%);pointer-events:none}
.login-logo{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;margin-bottom:8px;
  background:linear-gradient(135deg,var(--brand2),var(--brand));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:40px}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:28px 24px;width:100%;position:relative;z-index:1}
.field-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:1.5px;margin-bottom:8px;display:block}
.field-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:13px 16px;color:var(--text);font-size:15px;transition:border-color .2s;margin-bottom:16px}
.field-input:focus{border-color:var(--brand)}
.field-input::placeholder{color:var(--muted)}
.login-btn{width:100%;padding:15px;border-radius:12px;
  background:linear-gradient(135deg,var(--brand),#8B5CF6);color:#fff;
  font-size:16px;font-weight:700;font-family:'Syne',sans-serif;letter-spacing:.5px;
  transition:transform .15s,opacity .15s;margin-top:4px}
.login-btn:active{transform:scale(.97)}
.login-error{color:var(--danger);font-size:13px;margin-top:12px;text-align:center}
.login-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}

/* Main App */
.main-app{display:none;flex:1;flex-direction:column}
.main-app.visible{display:flex}

/* Header */
.header{position:sticky;top:0;z-index:100;padding:calc(var(--safe-top)+12px) 20px 12px;
  background:rgba(9,9,15,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;
  background:linear-gradient(135deg,var(--brand2),var(--brand));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logout-btn{padding:7px 14px;border-radius:8px;background:rgba(239,68,68,.15);
  border:1px solid rgba(239,68,68,.3);color:var(--danger);font-size:12px;font-weight:600}

/* Pages */
.page{display:none;flex:1;flex-direction:column}
.page.active{display:flex}

/* Stats Dashboard */
.dash-page{padding:20px 16px 100px;overflow-y:auto}
.page-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:18px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;position:relative;overflow:hidden}
.kpi-card::after{content:attr(data-emoji);position:absolute;right:12px;bottom:8px;font-size:32px;opacity:.15}
.kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.kpi-val{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:var(--text)}
.kpi-val.brand{color:var(--brand2)}
.kpi-val.success{color:var(--success)}
.kpi-val.warning{color:var(--warning)}
.section-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.sc-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--brand2);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;
  border-bottom:1px solid var(--border);font-size:13px}
.stat-row:last-child{border-bottom:none}
.stat-bar-wrap{flex:1;margin:0 12px;height:6px;background:var(--surface);border-radius:3px;overflow:hidden}
.stat-bar{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:3px;transition:width .5s ease}
.orders-table{width:100%;border-collapse:collapse}
.orders-table th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;
  padding:0 8px 10px;text-align:left;border-bottom:1px solid var(--border)}
.orders-table td{padding:10px 8px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.orders-table tr:last-child td{border-bottom:none}
.status-dot-sm{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px}

/* Menu Management */
.menu-page{padding:16px 16px 100px;overflow-y:auto}
.add-item-btn{width:100%;padding:14px;border-radius:14px;
  background:linear-gradient(135deg,var(--brand),#8B5CF6);color:#fff;
  font-size:15px;font-weight:700;font-family:'Syne',sans-serif;margin-bottom:18px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.menu-item-row{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.mi-emoji{font-size:32px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border-radius:10px;flex-shrink:0}
.mi-info{flex:1;min-width:0}
.mi-name{font-size:14px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi-meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.mi-actions{display:flex;gap:6px;flex-shrink:0}
.mi-edit-btn{width:32px;height:32px;border-radius:8px;background:rgba(108,71,255,.2);
  border:1px solid rgba(108,71,255,.3);color:var(--brand2);font-size:14px;
  display:flex;align-items:center;justify-content:center}
.mi-del-btn{width:32px;height:32px;border-radius:8px;background:rgba(239,68,68,.15);
  border:1px solid rgba(239,68,68,.25);color:var(--danger);font-size:14px;
  display:flex;align-items:center;justify-content:center}
.toggle-avail{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.toggle-avail.on{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.3);color:var(--success)}
.toggle-avail.off{color:var(--muted)}

/* Orders Page */
.orders-page{padding:16px 16px 100px;overflow-y:auto}
.order-row{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px;margin-bottom:10px}
.or-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.or-id{font-family:'Syne',sans-serif;font-size:11px;color:var(--muted);font-weight:700}
.or-time{font-size:11px;color:var(--muted)}
.or-customer{font-size:14px;font-weight:700;margin-bottom:3px}
.or-address{font-size:12px;color:var(--muted);margin-bottom:8px}
.or-items{font-size:12px;color:var(--muted);padding:8px 10px;background:var(--surface);
  border-radius:8px;margin-bottom:8px}
.or-footer{display:flex;align-items:center;justify-content:space-between}
.or-total{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--brand2)}
.status-sel{background:var(--surface);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:12px;padding:6px 10px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;
  opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);
  width:100%;max-width:430px;background:var(--surface);border-radius:24px 24px 0 0;
  z-index:301;transition:transform .35s cubic-bezier(.4,0,.2,1);
  max-height:90vh;overflow-y:auto;padding-bottom:calc(24px + var(--safe-bot))}
.modal.open{transform:translateX(-50%) translateY(0)}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0}
.modal-header{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800}
.modal-body{padding:0 20px}
.form-group{margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.save-btn{width:100%;padding:15px;border-radius:12px;
  background:linear-gradient(135deg,var(--brand),#8B5CF6);color:#fff;
  font-size:15px;font-weight:700;font-family:'Syne',sans-serif;margin-top:8px}
.save-btn:active{transform:scale(.97)}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  background:rgba(9,9,15,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);
  padding:8px 0 calc(8px + var(--safe-bot));display:flex;z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px 0;cursor:pointer;color:var(--muted);font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.5px}
.nav-item.active{color:var(--brand2)}
.nav-icon{font-size:22px}

/* Status chips */
.chip{display:inline-flex;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.chip-pending{background:rgba(245,158,11,.15);color:var(--warning)}
.chip-accepted{background:rgba(59,130,246,.15);color:#60A5FA}
.chip-preparing{background:rgba(245,158,11,.15);color:var(--warning)}
.chip-out_for_delivery{background:rgba(108,71,255,.2);color:var(--brand2)}
.chip-delivered{background:rgba(16,185,129,.15);color:var(--success)}

/* Toast */
.toast{position:fixed;top:calc(var(--safe-top)+70px);left:50%;transform:translateX(-50%) translateY(-15px);
  background:var(--card);border:1px solid var(--brand);border-radius:12px;padding:11px 20px;
  font-size:13px;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:all .3s;
  color:var(--brand2);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Misc */
.empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.fade-in{animation:fadeIn .3s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <!-- LOGIN SCREEN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-logo">DeliveryOS</div>
    <div class="login-sub">Admin Dashboard</div>
    <div class="login-card">
      <label class="field-label">Email</label>
      <input class="field-input" id="loginEmail" type="email" placeholder="admin@deliveryos.com" value="admin@deliveryos.com"/>
      <label class="field-label">Password</label>
      <input class="field-input" id="loginPwd" type="password" placeholder="••••••••" value="admin123"/>
      <button class="login-btn" onclick="doLogin()">Sign In →</button>
      <div class="login-error" id="loginError"></div>
      <div class="login-hint">Hint: email=admin@deliveryos.com, pass=admin123</div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div class="main-app" id="mainApp">
    <header class="header">
      <span class="logo">DeliveryOS Admin</span>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </header>

    <!-- DASHBOARD -->
    <div class="page active" id="dashPage">
      <div class="dash-page">
        <div class="page-title">📊 Dashboard</div>
        <div class="kpi-grid" id="kpiGrid"></div>
        <div class="section-card">
          <div class="sc-title">Top Items</div>
          <div id="topItems"></div>
        </div>
        <div class="section-card">
          <div class="sc-title">Order Status Breakdown</div>
          <div id="statusBreakdown"></div>
        </div>
        <div class="section-card">
          <div class="sc-title">Recent Orders</div>
          <table class="orders-table" id="recentOrdersTable">
            <thead><tr><th>ID</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead>
            <tbody id="recentOrdersTbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- MENU MANAGEMENT -->
    <div class="page" id="menuPage">
      <div class="menu-page">
        <div class="page-title">🍽️ Menu</div>
        <button class="add-item-btn" onclick="openAddItem()">+ Add New Item</button>
        <div id="menuList"></div>
      </div>
    </div>

    <!-- ORDERS MANAGEMENT -->
    <div class="page" id="ordersPage">
      <div class="orders-page">
        <div class="page-title">📦 Orders</div>
        <div id="allOrdersList"></div>
      </div>
    </div>

    <nav class="bottom-nav">
      <div class="nav-item active" onclick="showPage('dash',this)">
        <div class="nav-icon">📊</div>Stats
      </div>
      <div class="nav-item" onclick="showPage('menu',this)">
        <div class="nav-icon">🍽️</div>Menu
      </div>
      <div class="nav-item" onclick="showPage('orders',this)">
        <div class="nav-icon">📦</div>Orders
      </div>
    </nav>
  </div>
</div>

<!-- Add/Edit Item Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
<div class="modal" id="itemModal">
  <div class="modal-handle"></div>
  <div class="modal-header">
    <span class="modal-title" id="modalTitle">Add Item</span>
    <button style="width:32px;height:32px;border-radius:10px;background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center" onclick="closeModal()">✕</button>
  </div>
  <div class="modal-body">
    <input type="hidden" id="editId"/>
    <div class="form-row">
      <div>
        <label class="field-label">Emoji</label>
        <input class="field-input" id="fEmoji" placeholder="🍕" maxlength="2"/>
      </div>
      <div>
        <label class="field-label">Category</label>
        <input class="field-input" id="fCategory" placeholder="Pizza"/>
      </div>
    </div>
    <div class="form-group">
      <label class="field-label">Item Name</label>
      <input class="field-input" id="fName" placeholder="Margherita Pizza"/>
    </div>
    <div class="form-group">
      <label class="field-label">Description</label>
      <input class="field-input" id="fDesc" placeholder="Classic tomato & mozzarella"/>
    </div>
    <div class="form-row">
      <div>
        <label class="field-label">Price ($)</label>
        <input class="field-input" id="fPrice" type="number" step="0.01" placeholder="12.99"/>
      </div>
      <div>
        <label class="field-label">Available?</label>
        <select class="field-input" id="fAvail">
          <option value="true">Yes ✓</option>
          <option value="false">No ✗</option>
        </select>
      </div>
    </div>
    <button class="save-btn" onclick="saveItem()">💾 Save Item</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import Store from '../shared/store.js';

// ── Auth ──
window.doLogin = () => {
  const email = document.getElementById('loginEmail').value;
  const pwd = document.getElementById('loginPwd').value;
  const users = Store.getUsers();
  const admin = users.find(u => u.role==='admin' && u.email===email && u.password===pwd);
  if (!admin) { document.getElementById('loginError').textContent = '❌ Invalid credentials'; return; }
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').classList.add('visible');
  loadDash();
  loadMenu();
  loadAllOrders();
};
window.doLogout = () => {
  document.getElementById('mainApp').classList.remove('visible');
  document.getElementById('loginScreen').style.display = '';
};

// ── Dashboard ──
function loadDash() {
  const s = Store.getStats();
  document.getElementById('kpiGrid').innerHTML = [
    { label:'Total Orders', val: s.total, emoji:'📦', cls:'brand' },
    { label:'Delivered', val: s.delivered, emoji:'✅', cls:'success' },
    { label:'Revenue', val: '$'+s.revenue.toFixed(2), emoji:'💰', cls:'warning' },
    { label:"Today's Orders", val: s.todayOrders, emoji:'🔥', cls:'' },
  ].map(k=>`
    <div class="kpi-card fade-in" data-emoji="${k.emoji}">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-val ${k.cls}">${k.val}</div>
    </div>
  `).join('');

  // Top items
  const topEl = document.getElementById('topItems');
  if (!s.top5.length) { topEl.innerHTML='<div class="empty">No orders yet</div>'; }
  else {
    const max = s.top5[0][1];
    topEl.innerHTML = s.top5.map(([name,count])=>`
      <div class="stat-row">
        <span style="font-size:13px">${name}</span>
        <div class="stat-bar-wrap"><div class="stat-bar" style="width:${(count/max)*100}%"></div></div>
        <span style="font-size:12px;color:var(--brand2);font-weight:700;min-width:24px;text-align:right">${count}</span>
      </div>
    `).join('');
  }

  // Status breakdown
  const sbEl = document.getElementById('statusBreakdown');
  const total = Object.values(s.statusCounts).reduce((a,b)=>a+b,0)||1;
  const colors = { pending:'#F59E0B', accepted:'#60A5FA', preparing:'#F59E0B', out_for_delivery:'#A78BFA', delivered:'#10B981' };
  sbEl.innerHTML = Object.entries(s.statusCounts).map(([status,count])=>`
    <div class="stat-row">
      <span style="font-size:13px;text-transform:capitalize">${status.replace('_',' ')}</span>
      <div class="stat-bar-wrap"><div class="stat-bar" style="width:${(count/total)*100}%;background:${colors[status]||'var(--brand)'}"></div></div>
      <span style="font-size:12px;color:var(--brand2);font-weight:700;min-width:20px;text-align:right">${count}</span>
    </div>
  `).join('') || '<div class="empty">No order data</div>';

  // Recent orders table
  const orders = Store.getOrders().slice(0,10);
  document.getElementById('recentOrdersTbody').innerHTML = orders.map(o=>`
    <tr>
      <td style="font-family:'Syne',sans-serif;font-size:10px;color:var(--muted)">#${o.id.split('_')[1]}</td>
      <td>${o.customerName||'—'}</td>
      <td style="color:var(--brand2);font-weight:700">$${Number(o.total).toFixed(2)}</td>
      <td><span class="chip chip-${o.status}">${o.status.replace('_',' ')}</span></td>
    </tr>
  `).join('') || '<tr><td colspan="4" class="empty">No orders</td></tr>';
}

// ── Menu ──
function loadMenu() {
  const items = Store.getMenu();
  const el = document.getElementById('menuList');
  el.innerHTML = items.map(m=>`
    <div class="menu-item-row fade-in">
      <div class="mi-emoji">${m.emoji||'🍽️'}</div>
      <div class="mi-info">
        <div class="mi-name">${m.name}</div>
        <div class="mi-meta">${m.category} · $${Number(m.price).toFixed(2)}</div>
        <button class="toggle-avail ${m.available?'on':'off'}" onclick="window.toggleAvail('${m.id}')">
          ${m.available?'✓ Available':'✗ Hidden'}
        </button>
      </div>
      <div class="mi-actions">
        <button class="mi-edit-btn" onclick="window.openEditItem('${m.id}')">✏️</button>
        <button class="mi-del-btn" onclick="window.deleteItem('${m.id}')">🗑️</button>
      </div>
    </div>
  `).join('') || '<div class="empty">No menu items yet</div>';
}

window.openAddItem = () => {
  document.getElementById('editId').value='';
  document.getElementById('modalTitle').textContent='Add Item';
  ['fEmoji','fCategory','fName','fDesc','fPrice'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fAvail').value='true';
  openModal();
};
window.openEditItem = id => {
  const item = Store.getMenu().find(m=>m.id===id);
  if (!item) return;
  document.getElementById('editId').value = id;
  document.getElementById('modalTitle').textContent = 'Edit Item';
  document.getElementById('fEmoji').value = item.emoji||'';
  document.getElementById('fCategory').value = item.category||'';
  document.getElementById('fName').value = item.name;
  document.getElementById('fDesc').value = item.desc||'';
  document.getElementById('fPrice').value = item.price;
  document.getElementById('fAvail').value = item.available?'true':'false';
  openModal();
};
window.saveItem = () => {
  const id = document.getElementById('editId').value;
  const data = {
    emoji: document.getElementById('fEmoji').value||'🍽️',
    category: document.getElementById('fCategory').value||'Other',
    name: document.getElementById('fName').value,
    desc: document.getElementById('fDesc').value,
    price: parseFloat(document.getElementById('fPrice').value)||0,
    available: document.getElementById('fAvail').value==='true',
  };
  if (!data.name) { toast('⚠️ Name required'); return; }
  if (id) { Store.updateMenuItem(id,data); toast('✅ Item updated'); }
  else { Store.addMenuItem(data); toast('✅ Item added'); }
  closeModal();
  loadMenu();
  loadDash();
};
window.deleteItem = id => {
  if (!confirm('Delete this item?')) return;
  Store.deleteMenuItem(id);
  loadMenu();
  loadDash();
  toast('🗑 Item deleted');
};
window.toggleAvail = id => {
  const item = Store.getMenu().find(m=>m.id===id);
  if (!item) return;
  Store.updateMenuItem(id,{available:!item.available});
  loadMenu();
  toast(item.available?'Item hidden':'Item now visible');
};

// ── All Orders ──
function loadAllOrders() {
  const orders = Store.getOrders();
  const el = document.getElementById('allOrdersList');
  if (!orders.length) { el.innerHTML='<div class="empty">No orders yet</div>'; return; }
  el.innerHTML = orders.map(o=>`
    <div class="order-row fade-in">
      <div class="or-header">
        <div>
          <span class="or-id">#${o.id.split('_')[1]}</span>
          <span class="chip chip-${o.status}" style="margin-left:8px">${o.status.replace('_',' ')}</span>
        </div>
        <span class="or-time">${timeAgo(o.createdAt)}</span>
      </div>
      <div class="or-customer">👤 ${o.customerName||'—'}</div>
      <div class="or-address">📍 ${o.address||'—'}</div>
      <div class="or-items">${o.items.map(i=>`${i.qty}× ${i.name}`).join(' · ')}</div>
      <div class="or-footer">
        <span class="or-total">$${Number(o.total).toFixed(2)}</span>
        <select class="status-sel" onchange="window.changeOrderStatus('${o.id}',this.value)">
          ${['pending','accepted','preparing','out_for_delivery','delivered'].map(s=>
            `<option value="${s}" ${o.status===s?'selected':''}>${s.replace('_',' ')}</option>`
          ).join('')}
        </select>
      </div>
    </div>
  `).join('');
}

window.changeOrderStatus = (id, status) => {
  Store.updateOrderStatus(id, status);
  loadDash();
  toast('✅ Status updated');
};

// ── Modal ──
function openModal() {
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('itemModal').classList.add('open');
}
window.closeModal = () => {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('itemModal').classList.remove('open');
};

// ── Pages ──
window.showPage = (name, el) => {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById(name+'Page').classList.add('active');
  el.classList.add('active');
  if (name==='dash') { loadDash(); }
  if (name==='menu') loadMenu();
  if (name==='orders') loadAllOrders();
};

// ── Store updates ──
Store.onUpdate(() => {
  const dash = document.getElementById('dashPage').classList.contains('active');
  const orders = document.getElementById('ordersPage').classList.contains('active');
  if (dash) loadDash();
  if (orders) loadAllOrders();
});

// ── Toast ──
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

function timeAgo(iso) {
  const m = Math.floor((Date.now()-new Date(iso).getTime())/60000);
  return m<1?'now':m<60?m+'m':Math.floor(m/60)+'h';
}
</script>

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").then(r => console.log("SW registered")).catch(e => console.log("SW error",e));
}
